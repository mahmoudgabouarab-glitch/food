name: food
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dartz: ^0.10.1
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  flutter_secure_storage: ^10.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  adaptive_dialog: ^2.6.0
  image_cropper: ^11.0.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/logolauncher.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/svg/

